name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tests/*.test.js

      # The sign-in helper is Python, and its flow is worth running on every
      # change: it talks to a stand-in platform, so it needs nothing reachable.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the sign-in helper
        run: python3 -W error::ResourceWarning tests/auth_test.py

      # The fields omarchy-shell checks before loading the plugin
      - name: Manifest
        run: |
          jq -e '.schemaVersion == 1 and .id == "rzilient.pulzar" and (.kinds | index("bar-widget")) and (.entryPoints.barWidget | type == "string")' manifest.json
          test -f "$(jq -r .entryPoints.barWidget manifest.json)"
